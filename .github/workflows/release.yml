name: ClashOfPens Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as official GitHub Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Android Build (Debug APK, and Release APK + AAB if keystore secrets exist)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Assets
        run: npm run build:web

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          mkdir -p release-builds
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../release-builds/ClashOfPens-Android-debug.apk
          cd ..

      - name: Build Signed Android Release APK & AAB (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release keystore secret detected. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cd android
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../release-builds/ClashOfPens-Android-release.apk
            cp app/build/outputs/bundle/release/app-release.aab ../release-builds/ClashOfPens-Android-release.aab
            cd ..
            echo "Successfully built signed Release APK and AAB."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 or passwords not configured. Debug APK was successfully generated for direct testing. Configure repository secrets for production Play Store signing."
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: release-builds/*.*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Windows Desktop Build (x64 Installer, Portable, and x86 Installer)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop (x64 & x86)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Assets
        run: npm run build:web

      - name: Package Windows x64 Installer & Portable
        run: npx electron-builder --win --x64

      - name: Package Windows x86 Installer
        run: npx electron-builder --win --ia32
        continue-on-error: true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release-builds/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Linux Desktop Build (x64 AppImage and .deb)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux Desktop (x64 AppImage & DEB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application Assets
        run: npm run build:web

      - name: Package Linux x64 (AppImage & deb)
        run: npx electron-builder --linux --x64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release-builds/*.AppImage
            release-builds/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. GitHub Release Publisher (Only for version tags v* or manual release)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Release Assets
        run: |
          mkdir -p final-release-assets
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) -exec cp {} final-release-assets/ \;
          ls -la final-release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
